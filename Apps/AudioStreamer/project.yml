name: AudioStreamer
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: "17.0"
packages:
  MacCaptureVerifier:
    path: ../..
targets:
  AudioStreamer:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: MacCaptureVerifier
        product: ClientCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.AudioStreamer
        DEVELOPMENT_TEAM: A1B2C3D4E5
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Sources/Support/Info.plist
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: 6.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
