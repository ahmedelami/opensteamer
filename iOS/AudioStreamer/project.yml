name: AudioStreamer
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: "17.0"
packages:
  MacCaptureVerifier:
    path: ../..
targets:
  AudioStreamer:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: MacCaptureVerifier
        product: ClientCore
      - package: MacCaptureVerifier
        product: RemoteSessionCore
      - package: MacCaptureVerifier
        product: Streaming
      - package: MacCaptureVerifier
        product: WebRTCTransport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.AudioStreamer
        DEVELOPMENT_TEAM: A1B2C3D4E5
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Sources/Support/Info.plist
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: 6.0
        AUDIOSTREAMER_RENDEZVOUS_URL: "wss://rendezvous.example.invalid"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          # Keep XCTest/development installs beside the TestFlight app instead of
          # replacing its container during physical-device validation.
          PRODUCT_BUNDLE_IDENTIFIER: org.example.AudioStreamer.dev
    scheme:
      testTargets:
        - AudioStreamerTests
  AudioStreamerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: AudioStreamer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.AudioStreamerTests
        DEVELOPMENT_TEAM: A1B2C3D4E5
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
  AudioStreamerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: AudioStreamer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.AudioStreamerUITests
        DEVELOPMENT_TEAM: A1B2C3D4E5
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
        TEST_TARGET_NAME: AudioStreamer
    scheme:
      testTargets:
        - AudioStreamerUITests
