name: opensteamer
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: "17.0"
packages:
  opensteamer:
    path: ../..
targets:
  opensteamer:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: ../../THIRD_PARTY_NOTICES.md
        name: THIRD_PARTY_NOTICES.md
        group: opensteamer
        buildPhase: resources
    dependencies:
      - package: opensteamer
        product: ClientCore
      - package: opensteamer
        product: RemoteSessionCore
      - package: opensteamer
        product: Streaming
      - package: opensteamer
        product: WebRTCTransport
    settings:
      base:
        # The shipped identity intentionally keeps its legacy spelling. Changing it would create a
        # different App Store app/container and revoke access to the existing default Keychain group.
        PRODUCT_BUNDLE_IDENTIFIER: org.example.AudioStreamer
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Sources/Support/Info.plist
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: 6.0
        # Public source does not embed a maintainer endpoint. Supply this build setting locally.
        OPENSTEAMER_RENDEZVOUS_URL: ""
        # One-release build-pipeline fallback. Keep the old input readable while deployments move
        # to OPENSTEAMER_RENDEZVOUS_URL; it is not user-visible branding or a persistence key.
        AUDIOSTREAMER_RENDEZVOUS_URL: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          # Keep XCTest/development installs beside a distribution build instead of
          # replacing its container during physical-device validation. This identifier is also
          # stable because the install-over-update oracle addresses the same development container.
          PRODUCT_BUNDLE_IDENTIFIER: org.example.AudioStreamer.dev
    scheme:
      testTargets:
        - opensteamerTests
  opensteamerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - OracleTestSupport
    dependencies:
      - target: opensteamer
    settings:
      base:
        # Preserve the established physical-validation signing identities across the rebrand.
        PRODUCT_BUNDLE_IDENTIFIER: org.example.AudioStreamerTests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
  opensteamerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
      - OracleTestSupport
    dependencies:
      - target: opensteamer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.AudioStreamerUITests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
        TEST_TARGET_NAME: opensteamer
    scheme:
      testTargets:
        - opensteamerUITests
