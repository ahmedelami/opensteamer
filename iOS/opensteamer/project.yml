name: opensteamer
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: "17.0"
packages:
  opensteamer:
    path: ../..
targets:
  opensteamer:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: ../../THIRD_PARTY_NOTICES.md
        name: THIRD_PARTY_NOTICES.md
        group: opensteamer
        buildPhase: resources
    dependencies:
      - package: opensteamer
        product: ClientCore
      - package: opensteamer
        product: RemoteSessionCore
      - package: opensteamer
        product: Streaming
      - package: opensteamer
        product: WebRTCTransport
    attributes:
      ProvisioningStyle: Automatic
    settings:
      base:
        INFOPLIST_FILE: Sources/Support/Info.plist
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: 6.0
        # Development builds remain endpoint-free unless explicitly overridden.
        OPENSTEAMER_RENDEZVOUS_URL: ""
        # Keep the pre-rebrand Info.plist input available in development without changing its
        # compatibility role; Release supplies the same production origin to both inputs.
        AUDIOSTREAMER_RENDEZVOUS_URL: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          # Keep XCTest/development installs beside a distribution build instead of
          # replacing its container during physical-device validation. This identifier is also
          # stable because the install-over-update oracle addresses the same development container.
          PRODUCT_BUNDLE_IDENTIFIER: org.example.AudioStreamer.dev
        Release:
          # App Store Connect/TestFlight production identity. Legacy Keychain service and
          # protocol literals remain org.example.AudioStreamer compatibility data.
          PRODUCT_BUNDLE_IDENTIFIER: com.elamin.AudioStreamer
          DEVELOPMENT_TEAM: MSMG8CJLB3
          CURRENT_PROJECT_VERSION: 32
          CODE_SIGN_STYLE: Automatic
          OPENSTEAMER_RENDEZVOUS_URL: "wss://audiostreamer-rendezvous.elaminahmed03.workers.dev"
          AUDIOSTREAMER_RENDEZVOUS_URL: "wss://audiostreamer-rendezvous.elaminahmed03.workers.dev"
    scheme:
      testTargets:
        - opensteamerTests
  opensteamerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - OracleTestSupport
    dependencies:
      - target: opensteamer
    settings:
      base:
        # Preserve the established physical-validation signing identities across the rebrand.
        PRODUCT_BUNDLE_IDENTIFIER: org.example.AudioStreamerTests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
  opensteamerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
      - OracleTestSupport
    dependencies:
      - target: opensteamer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.AudioStreamerUITests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
        TEST_TARGET_NAME: opensteamer
    scheme:
      testTargets:
        - opensteamerUITests
