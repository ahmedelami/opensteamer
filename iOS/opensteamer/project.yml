name: opensteamer
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: "17.0"
  # XcodeGen 2.45 emits runnable actions even when a top-level scheme declares only archive.
  # Restore the reviewed archive-only scheme after every regeneration.
  postGenCommand: /bin/zsh scripts/restore-archive-only-testflight-scheme.sh
configs:
  Debug: debug
  Release: release
  # Archive-only side-by-side distribution. The existing Release configuration intentionally
  # retains the protected com.elamin.AudioStreamer identity and is not used by this path.
  TestFlight: release
packages:
  opensteamer:
    path: ../..
targets:
  opensteamer:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: ../../THIRD_PARTY_NOTICES.md
        name: THIRD_PARTY_NOTICES.md
        group: opensteamer
        buildPhase: resources
    dependencies:
      - package: opensteamer
        product: ClientCore
      - package: opensteamer
        product: RemoteSessionCore
      - package: opensteamer
        product: Streaming
      - package: opensteamer
        product: WebRTCTransport
    attributes:
      ProvisioningStyle: Automatic
    settings:
      base:
        INFOPLIST_FILE: Sources/Support/Info.plist
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: 6.0
        # Development builds remain endpoint-free unless explicitly overridden.
        OPENSTEAMER_RENDEZVOUS_URL: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          # Keep XCTest/development installs beside a distribution build instead of
          # replacing its container during physical-device validation. This identifier is also
          # stable because the install-over-update oracle addresses the same development container.
          PRODUCT_BUNDLE_IDENTIFIER: org.example.AudioStreamer.dev
        Release:
          # Protected production identity retained solely for legacy compatibility. The guarded
          # side-by-side TestFlight path below must never archive this configuration.
          PRODUCT_BUNDLE_IDENTIFIER: com.elamin.AudioStreamer
          DEVELOPMENT_TEAM: MSMG8CJLB3
          CURRENT_PROJECT_VERSION: 36
          CODE_SIGN_STYLE: Automatic
          OPENSTEAMER_RENDEZVOUS_URL: "wss://audiostreamer-rendezvous.elaminahmed03.workers.dev"
        TestFlight:
          # This identity must remain distinct from the protected production app so installing a
          # TestFlight build cannot replace its app container or binary.
          PRODUCT_BUNDLE_IDENTIFIER: com.elamin.opensteamer
          DEVELOPMENT_TEAM: MSMG8CJLB3
          CURRENT_PROJECT_VERSION: 49
          CODE_SIGN_STYLE: Automatic
          OPENSTEAMER_RENDEZVOUS_URL: "wss://audiostreamer-rendezvous.elaminahmed03.workers.dev"
    scheme:
      testTargets:
        - opensteamerTests
  opensteamerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - OracleTestSupport
    dependencies:
      - target: opensteamer
    settings:
      base:
        # Preserve the established physical-validation signing identities across the rebrand.
        PRODUCT_BUNDLE_IDENTIFIER: org.example.AudioStreamerTests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
  opensteamerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
      - OracleTestSupport
    dependencies:
      - target: opensteamer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.AudioStreamerUITests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
        TEST_TARGET_NAME: opensteamer
    scheme:
      testTargets:
        - opensteamerUITests
