<!doctype html>
<!--
  Manual, deterministic browser audio source for validating opensteamer's system-audio path.
  Open this file in a graphical browser and press Start tone; the click satisfies the browser's
  user-gesture requirement and produces a 440 Hz oscillator at 25% gain. Stop closes its
  AudioContext. The page performs no network requests and stores no data. `data-playing`, the
  visible status, and the live AudioContext state are stable observation points for automation.
  Reloading or closing the page lets the browser release any still-active audio resources.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>opensteamer Tone Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 40px;
    }

    button {
      font-size: 22px;
      margin-right: 12px;
      padding: 12px 16px;
    }
  </style>
</head>
<body>
  <h1>opensteamer Tone Test</h1>
  <button id="start" type="button">Start tone</button>
  <button id="stop" type="button">Stop</button>
  <p id="status">Stopped</p>
  <p id="context-state">AudioContext: none</p>
  <script>
    // Expose handles deliberately so a manual or browser-automation probe can inspect playback
    // state without inferring it from audible output alone.
    window.audioTest = {
      context: undefined,
      oscillator: undefined,
      gain: undefined
    };

    document.getElementById("start").addEventListener("click", async () => {
      window.audioTest.context = new AudioContext();
      await window.audioTest.context.resume();
      window.audioTest.oscillator = window.audioTest.context.createOscillator();
      window.audioTest.gain = window.audioTest.context.createGain();
      // A fixed frequency and gain make repeated capture measurements comparable.
      window.audioTest.oscillator.frequency.value = 440;
      window.audioTest.gain.gain.value = 0.25;
      window.audioTest.oscillator.connect(window.audioTest.gain).connect(window.audioTest.context.destination);
      window.audioTest.oscillator.start();
      document.body.dataset.playing = "true";
      document.getElementById("status").textContent = "Playing";
      updateState();
    });

    document.getElementById("stop").addEventListener("click", async () => {
      if (window.audioTest.oscillator) {
        window.audioTest.oscillator.stop();
      }
      if (window.audioTest.context) {
        await window.audioTest.context.close();
      }
      document.body.dataset.playing = "false";
      document.getElementById("status").textContent = "Stopped";
      updateState();
    });

    function updateState() {
      const state = window.audioTest.context
        ? `${window.audioTest.context.state} @ ${window.audioTest.context.currentTime.toFixed(2)}s`
        : "none";
      document.getElementById("context-state").textContent = `AudioContext: ${state}`;
    }

    // Periodic state is diagnostic only and does not alter the audio graph.
    setInterval(updateState, 250);
  </script>
</body>
</html>
