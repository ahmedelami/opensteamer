name = "audiostreamer-rendezvous-test"
main = "src/index.js"
compatibility_date = "2026-07-13"

[vars]
INVITATION_TTL_SECONDS = "1"
TOMBSTONE_TTL_SECONDS = "1"
STUN_URLS = "stun:stun.cloudflare.com:3478"
TURN_CREDENTIAL_TTL_SECONDS = "600"
TURN_FETCH_TIMEOUT_MS = "50"

[[ratelimits]]
name = "JOIN_RATE_LIMITER"
namespace_id = "1001001"

  [ratelimits.simple]
  # Keep production's limiter behavior out of cross-test accounting. Individual rate-limit
  # behavior should use an isolated binding rather than making unrelated WebSocket scenarios
  # consume one shared test-process bucket.
  limit = 1000
  period = 60

[[durable_objects.bindings]]
name = "RENDEZVOUS"
class_name = "RendezvousSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RendezvousSession"]
